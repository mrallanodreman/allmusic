name: Importar artes originales Buena Música

on:
  push:
    paths:
      - '.github/workflows/import-buena-musica-artes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Descargar afiches originales en PNG
        env:
          IMAGE_1: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa40513f3-75ec-41cd-af41-722bd8753964/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAABqH7zLhKbSXSOIsx50pwuf71bolXzTpZBxaI_tgTudC&exp=1795345812&osig=AAAAAAAAAAAAAAAAAAAAALrQ291pFihy6mVA-czQjGU_Iqptae_v8xd3HcfB0uvo&signer=media-rpc&token=AAIAAU0AJGE0MDUxM2YzLTc1ZWMtNDFjZC1hZjQxLTcyMmJkODc1Mzk2NAAAAAABogLzCiBgBbwanGt7vyVCylJIYzxwD7xjO9HWrwY9ZwShbSVqnQ&x-canva-quality=thumbnail"
          IMAGE_2: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2F3e0b5f04-40a0-466a-946b-f05cb075e4b6/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAADSL0fWPa7AkOBuuNjigLsUST-S7e89CVLr8JBl0NalH&exp=1795346756&osig=AAAAAAAAAAAAAAAAAAAAAF7v0hz2YY4VomLdj2j9rPd751pof17POXJ7fk2nnCj_&signer=media-rpc&token=AAIAAU0AJDNlMGI1ZjA0LTQwYTAtNDY2YS05NDZiLWYwNWNiMDc1ZTRiNgAAAAABogMBcaArzBBP3mO25K7_AovuIEzS3EjsHF1j1LP8cGLHKrnPJg&x-canva-quality=thumbnail"
          IMAGE_3: "https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Ff4abb026-e901-4673-9a69-4df900adad81/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOMaTZesAZos0PJm6HTOXw4iKz1Y4h-7OmLAqZ2kxf9e&exp=1795347128&osig=AAAAAAAAAAAAAAAAAAAAAF3DEMeaeWEb1yzFlYIah3JtVuyZ6SveLXkBDyjqbt-3&signer=media-rpc&token=AAIAAU0AJGY0YWJiMDI2LWU5MDEtNDY3My05YTY5LTRkZjkwMGFkYWQ4MQAAAAABogMHHsDBtKpnEBD-kpKB7yQuMG1EJeaQvhr3po8ViM_--KBAlQ&x-canva-quality=thumbnail"
        run: |
          set -euo pipefail
          mkdir -p public/assets/community
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_1" --output "public/assets/community/buscamos-locutores.png"
          test "$(file -b --mime-type public/assets/community/buscamos-locutores.png)" = "image/png"
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_2" --output "public/assets/community/buscamos-djs.png"
          test "$(file -b --mime-type public/assets/community/buscamos-djs.png)" = "image/png"
          curl --fail --location --silent --show-error --retry 3 "$IMAGE_3" --output "public/assets/community/unete.png"
          test "$(file -b --mime-type public/assets/community/unete.png)" = "image/png"
      - name: Guardar imagenes en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/community/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(radio): imagenes originales de convocatorias PNG"
            git push origin HEAD:master
          fi
