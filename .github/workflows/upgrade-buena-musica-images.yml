name: Verificar originales en alta resolución

on:
  push:
    paths:
      - '.github/workflows/upgrade-buena-musica-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          persist-credentials: true
      - name: Buscar originales en alta calidad
        env:
          URL_1: "https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2Fa40513f3-75ec-41cd-af41-722bd8753964/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAABqH7zLhKbSXSOIsx50pwuf71bolXzTpZBxaI_tgTudC&exp=1795345812&osig=AAAAAAAAAAAAAAAAAAAAALrQ291pFihy6mVA-czQjGU_Iqptae_v8xd3HcfB0uvo&signer=media-rpc&token=AAIAAU0AJGE0MDUxM2YzLTc1ZWMtNDFjZC1hZjQxLTcyMmJkODc1Mzk2NAAAAAABogLzCiBgBbwanGt7vyVCylJIYzxwD7xjO9HWrwY9ZwShbSVqnQ"
          URL_2: "https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2F3e0b5f04-40a0-466a-946b-f05cb075e4b6/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAADSL0fWPa7AkOBuuNjigLsUST-S7e89CVLr8JBl0NalH&exp=1795346756&osig=AAAAAAAAAAAAAAAAAAAAAF7v0hz2YY4VomLdj2j9rPd751pof17POXJ7fk2nnCj_&signer=media-rpc&token=AAIAAU0AJDNlMGI1ZjA0LTQwYTAtNDY2YS05NDZiLWYwNWNiMDc1ZTRiNgAAAAABogMBcaArzBBP3mO25K7_AovuIEzS3EjsHF1j1LP8cGLHKrnPJg"
          URL_3: "https://media.canva.com/v2/image-resize/format:PNG/height:1254/quality:100/uri:ifs%3A%2F%2FM%2Ff4abb026-e901-4673-9a69-4df900adad81/watermark:F/width:1254?csig=AAAAAAAAAAAAAAAAAAAAAOMaTZesAZos0PJm6HTOXw4iKz1Y4h-7OmLAqZ2kxf9e&exp=1795347128&osig=AAAAAAAAAAAAAAAAAAAAAF3DEMeaeWEb1yzFlYIah3JtVuyZ6SveLXkBDyjqbt-3&signer=media-rpc&token=AAIAAU0AJGY0YWJiMDI2LWU5MDEtNDY3My05YTY5LTRkZjkwMGFkYWQ4MQAAAAABogMHHsDBtKpnEBD-kpKB7yQuMG1EJeaQvhr3po8ViM_--KBAlQ"
        run: |
          set -euo pipefail

          if curl -fsSL --retry 1 --max-time 20 "$URL_1" -o "/tmp/original_1.png"; then
            width=$(python3 -c 'import sys,struct;d=open(sys.argv[1],"rb").read(24);print(struct.unpack(">I",d[16:20])[0] if d[:8]==bytes.fromhex("89504e470d0a1a0a") else 0)' "/tmp/original_1.png")
            if [ "$width" -ge 600 ]; then
              cp "/tmp/original_1.png" "public/assets/community/buscamos-locutores.png"
            fi
          fi

          if curl -fsSL --retry 1 --max-time 20 "$URL_2" -o "/tmp/original_2.png"; then
            width=$(python3 -c 'import sys,struct;d=open(sys.argv[1],"rb").read(24);print(struct.unpack(">I",d[16:20])[0] if d[:8]==bytes.fromhex("89504e470d0a1a0a") else 0)' "/tmp/original_2.png")
            if [ "$width" -ge 600 ]; then
              cp "/tmp/original_2.png" "public/assets/community/buscamos-djs.png"
            fi
          fi

          if curl -fsSL --retry 1 --max-time 20 "$URL_3" -o "/tmp/original_3.png"; then
            width=$(python3 -c 'import sys,struct;d=open(sys.argv[1],"rb").read(24);print(struct.unpack(">I",d[16:20])[0] if d[:8]==bytes.fromhex("89504e470d0a1a0a") else 0)' "/tmp/original_3.png")
            if [ "$width" -ge 600 ]; then
              cp "/tmp/original_3.png" "public/assets/community/unete.png"
            fi
          fi
      - name: Guardar si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/community/*.png
          if ! git diff --cached --quiet; then
            git commit -m "assets(radio): afiches PNG en alta resolucion"
            git push origin HEAD:master
          fi
