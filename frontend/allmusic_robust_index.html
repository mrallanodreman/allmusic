<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllMusic - RapidAPI Edition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #searchInput {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            backdrop-filter: blur(5px);
        }

        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn {
            padding: 15px 25px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(45deg, #28a745, #20c997);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .error-message {
            background: rgba(220, 53, 69, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
            backdrop-filter: blur(5px);
        }

        .success-message {
            background: rgba(40, 167, 69, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            display: none;
            backdrop-filter: blur(5px);
        }

        .results-section {
            margin-top: 30px;
        }

        .result-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            margin: 10px 0;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .result-title {
            font-size: 1.2em;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .result-channel {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 15px;
        }

        .result-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #6f42c1, #e83e8c);
            color: white;
            font-size: 14px;
            padding: 10px 15px;
        }

        .btn-secondary:hover {
            transform: translateY(-1px);
        }

        .status-info {
            background: rgba(23, 162, 184, 0.8);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            backdrop-filter: blur(5px);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            z-index: 1000;
        }

        .status-connected {
            background: rgba(40, 167, 69, 0.9);
            color: white;
        }

        .status-disconnected {
            background: rgba(220, 53, 69, 0.9);
            color: white;
        }

        .status-checking {
            background: rgba(255, 193, 7, 0.9);
            color: black;
        }

        @media (max-width: 768px) {
            .search-container {
                flex-direction: column;
            }
            
            .result-actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">🔍 Detectando servidor...</div>
    
    <div class="container">
        <div class="header">
            <h1>🎵 AllMusic Server</h1>
            <p>Tecnología Avanzada con RapidAPI • Reproductor Multi-tecnología</p>
        </div>

        <div class="search-section">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Buscar música (ej. digimon, naruto, etc.)" />
                <button class="btn btn-primary" onclick="searchMusic()">🔍 Buscar</button>
            </div>
            
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            <div class="status-info" id="statusInfo" style="display: none;"></div>
        </div>

        <div class="results-section" id="resultsSection"></div>

        <div class="footer">
            <p>✅ AllMusic Server v3.0 - RapidAPI Edition</p>
            <p>🎯 Reproductor con HTML5 + Web Audio API + Fallback</p>
            <p id="serverInfo">🔧 Auto-detectando configuración del servidor...</p>
        </div>
    </div>

    <script>
        // 🚀 SISTEMA ROBUSTO DE AUTO-DETECCIÓN DE SERVIDOR
        let serverUrl = null;
        let serverInfo = null;
        const connectionStatus = document.getElementById('connectionStatus');
        
        // Lista de puertos posibles para el servidor AllMusic
        const possiblePorts = [2425, 2426, 2427, 2428, 2429, 3000, 3001, 8000, 8080];
        
        // Función para actualizar el estado de conexión
        function updateConnectionStatus(status, message) {
            connectionStatus.className = `connection-status status-${status}`;
            connectionStatus.textContent = message;
        }
        
        // Función para detectar automáticamente el servidor
        async function detectServer() {
            updateConnectionStatus('checking', '🔍 Detectando servidor...');
            
            const hostname = window.location.hostname;
            
            // Si ya estamos en un puerto específico, probarlo primero
            if (window.location.port) {
                const currentPort = window.location.port;
                const testUrl = `http://${hostname}:${currentPort}`;
                if (await testServerConnection(testUrl)) {
                    serverUrl = testUrl;
                    updateConnectionStatus('connected', `✅ Conectado: ${currentPort}`);
                    await loadServerInfo();
                    return true;
                }
            }
            
            // Probar puertos comunes
            for (const port of possiblePorts) {
                const testUrl = `http://${hostname}:${port}`;
                console.log(`🔍 Probando servidor en puerto ${port}...`);
                
                if (await testServerConnection(testUrl)) {
                    serverUrl = testUrl;
                    updateConnectionStatus('connected', `✅ Conectado: ${port}`);
                    await loadServerInfo();
                    return true;
                }
            }
            
            updateConnectionStatus('disconnected', '❌ Servidor no encontrado');
            showError('No se pudo conectar al servidor AllMusic. Verificar que esté ejecutándose.');
            return false;
        }
        
        // Función para probar la conexión a un servidor específico
        async function testServerConnection(url) {
            try {
                const response = await fetch(`${url}/api/info`, {
                    method: 'GET',
                    timeout: 3000,
                    signal: AbortSignal.timeout(3000)
                });
                
                if (response.ok) {
                    const info = await response.json();
                    return info && (info.name || info.version || info.status);
                }
                return false;
            } catch (error) {
                console.log(`❌ Puerto ocupado o servidor no responde: ${url.split(':').pop()}`);
                return false;
            }
        }
        
        // Función para cargar información del servidor
        async function loadServerInfo() {
            if (!serverUrl) return;
            
            try {
                const response = await fetch(`${serverUrl}/api/info`);
                if (response.ok) {
                    serverInfo = await response.json();
                    document.getElementById('serverInfo').innerHTML = 
                        `🔧 ${serverInfo.name || 'AllMusic Server'} • ` +
                        `Puerto: ${serverUrl.split(':').pop()} • ` +
                        `${serverInfo.version || 'v3.0'} • ` +
                        `API: ${serverInfo.api || 'RapidAPI'}`;
                }
            } catch (error) {
                console.error('Error cargando info del servidor:', error);
            }
        }
        
        // Función para mostrar errores
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = '❌ ' + message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        // Función para mostrar mensajes de éxito
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = '✅ ' + message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
        
        // Función para mostrar información de estado
        function showStatus(message) {
            const statusDiv = document.getElementById('statusInfo');
            statusDiv.textContent = 'ℹ️ ' + message;
            statusDiv.style.display = 'block';
        }
        
        // Función para buscar música
        async function searchMusic() {
            if (!serverUrl) {
                showError('No hay conexión con el servidor. Intentando reconectar...');
                await detectServer();
                return;
            }
            
            const query = document.getElementById('searchInput').value.trim();
            if (!query) {
                showError('Por favor introduce una búsqueda');
                return;
            }
            
            showStatus(`Buscando "${query}"...`);
            
            try {
                const response = await fetch(`${serverUrl}/search?q=${encodeURIComponent(query)}`);
                if (response.ok) {
                    const results = await response.json();
                    displayResults(results);
                    showSuccess(`Encontrados ${results.length} resultados`);
                } else {
                    const errorText = await response.text();
                    showError(`Error en la búsqueda: ${errorText}`);
                }
            } catch (error) {
                console.error('Error en búsqueda:', error);
                showError('Error conectando al servidor para buscar');
                // Intentar reconectar
                setTimeout(detectServer, 2000);
            }
        }
        
        // Función para mostrar resultados
        function displayResults(results) {
            const resultsSection = document.getElementById('resultsSection');
            
            if (!results || results.length === 0) {
                resultsSection.innerHTML = '<div class="result-item">No se encontraron resultados</div>';
                return;
            }
            
            resultsSection.innerHTML = results.map(result => `
                <div class="result-item">
                    <div class="result-title">${result.title}</div>
                    <div class="result-channel">📺 ${result.channelTitle || 'Canal desconocido'}</div>
                    <div class="result-actions">
                        <button class="btn btn-secondary" onclick="playAudio('${result.videoId}', '${result.title}')">
                            🎧 Reproducir
                        </button>
                        <button class="btn btn-secondary" onclick="downloadAudio('${result.videoId}', '${result.title}')">
                            📥 Descargar
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        // Función para reproducir audio
        async function playAudio(videoId, title) {
            if (!serverUrl) {
                showError('No hay conexión con el servidor');
                return;
            }
            
            showStatus(`Preparando reproducción: "${title}"`);
            
            try {
                const audioUrl = `${serverUrl}/audio-direct?url=https://www.youtube.com/watch?v=${videoId}`;
                
                // Crear elemento de audio
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                
                audio.onloadstart = () => showStatus(`Cargando audio: "${title}"`);
                audio.oncanplay = () => showSuccess(`Reproduciendo: "${title}"`);
                audio.onerror = (e) => {
                    console.error('Error de audio:', e);
                    showError(`Error reproduciendo: "${title}"`);
                };
                
                audio.src = audioUrl;
                audio.play();
                
            } catch (error) {
                console.error('Error reproduciendo:', error);
                showError(`Error reproduciendo: "${title}"`);
            }
        }
        
        // Función para descargar audio
        async function downloadAudio(videoId, title) {
            if (!serverUrl) {
                showError('No hay conexión con el servidor');
                return;
            }
            
            showStatus(`Preparando descarga: "${title}"`);
            
            try {
                const downloadUrl = `${serverUrl}/download?url=https://www.youtube.com/watch?v=${videoId}`;
                window.open(downloadUrl, '_blank');
                showSuccess(`Descarga iniciada: "${title}"`);
            } catch (error) {
                console.error('Error descargando:', error);
                showError(`Error descargando: "${title}"`);
            }
        }
        
        // Manejar Enter en el campo de búsqueda
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchMusic();
            }
        });
        
        // Detectar servidor al cargar la página
        window.addEventListener('load', detectServer);
        
        // Verificar conexión periódicamente
        setInterval(async () => {
            if (serverUrl && !await testServerConnection(serverUrl)) {
                updateConnectionStatus('disconnected', '❌ Conexión perdida');
                serverUrl = null;
                setTimeout(detectServer, 1000);
            }
        }, 30000);
    </script>
</body>
</html>
