<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllMusic - Híbrido</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .search-section {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            background: rgba(255,255,255,0.9);
            color: #333;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            background: white;
            transform: scale(1.02);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .search-btn {
            padding: 15px 30px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,107,107,0.4);
        }

        .search-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            text-align: center;
            padding: 10px;
            margin: 10px 0;
            border-radius: 10px;
            font-weight: bold;
        }

        .status.loading {
            background: rgba(255,193,7,0.2);
            color: #ffc107;
            border: 1px solid #ffc107;
        }

        .status.success {
            background: rgba(40,167,69,0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }

        .status.error {
            background: rgba(220,53,69,0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }

        .results-section {
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .result-card {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .result-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.15);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .result-card.playing {
            border: 2px solid #ff6b6b;
            background: rgba(255,107,107,0.2);
        }

        .result-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .result-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 0.9em;
            opacity: 0.8;
        }

        .result-duration {
            background: rgba(255,255,255,0.2);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8em;
        }

        .play-controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .play-btn, .stream-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .play-btn {
            background: #4CAF50;
            color: white;
        }

        .play-btn:hover {
            background: #45a049;
            transform: scale(1.05);
        }

        .stream-btn {
            background: #2196F3;
            color: white;
        }

        .stream-btn:hover {
            background: #1976D2;
            transform: scale(1.05);
        }

        .play-btn:disabled, .stream-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .player-section {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
        }

        .now-playing {
            text-align: center;
            margin-bottom: 20px;
        }

        .now-playing h3 {
            margin-bottom: 10px;
            color: #ff6b6b;
        }

        audio {
            width: 100%;
            max-width: 500px;
            height: 54px;
            border-radius: 25px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .stats {
            text-align: center;
            margin-top: 20px;
            opacity: 0.8;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 AllMusic</h1>
            <div class="subtitle">Servidor Híbrido - yt-dlp + YouTube MP3 API</div>
            <div class="subtitle">Búsqueda rápida • Conversión instantánea • Streaming directo</div>
        </div>

        <div class="search-section">
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Buscar música... (ej: bad bunny, taylor swift, rock clásico)" id="searchInput">
                <button class="search-btn" id="searchBtn">🔍 Buscar</button>
            </div>
            
            <div id="status" class="status" style="display: none;"></div>
        </div>

        <div class="results-section" id="resultsSection">
            <h2>📁 Resultados de Búsqueda</h2>
            <div class="results-grid" id="resultsGrid"></div>
        </div>

        <div class="player-section" id="playerSection">
            <div class="now-playing">
                <h3>🎧 Reproduciendo Ahora</h3>
                <div id="currentTitle">Selecciona una canción</div>
            </div>
            <audio controls id="audioPlayer" style="display: none;">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>

        <div class="stats">
            <p>💡 Tip: Haz clic en "Stream" para reproducir directamente o "Play" para abrir en una nueva pestaña</p>
        </div>
    </div>

    <script>
        class AllMusicApp {
            constructor() {
                this.baseURL = window.location.origin;
                this.currentPlaying = null;
                this.results = [];
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.showStatus('🎵 Listo para buscar música', 'success');
            }

            setupEventListeners() {
                const searchBtn = document.getElementById('searchBtn');
                const searchInput = document.getElementById('searchInput');

                searchBtn.addEventListener('click', () => this.search());
                searchInput.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.search();
                });
            }

            showStatus(message, type = 'info') {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.className = `status ${type}`;
                statusEl.style.display = 'block';
            }

            hideStatus() {
                document.getElementById('status').style.display = 'none';
            }

            async search() {
                const query = document.getElementById('searchInput').value.trim();
                
                if (!query) {
                    this.showStatus('❌ Por favor ingresa una búsqueda', 'error');
                    return;
                }

                const searchBtn = document.getElementById('searchBtn');
                searchBtn.disabled = true;
                searchBtn.innerHTML = '<span class="loading-spinner"></span> Buscando...';
                
                this.showStatus('🔍 Buscando en YouTube...', 'loading');

                try {
                    const response = await fetch(`${this.baseURL}/search?q=${encodeURIComponent(query)}`);
                    
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    
                    const data = await response.json();
                    
                    if (data.success && data.results) {
                        this.displayResults(data.results);
                        this.showStatus(`✅ Encontrados ${data.results.length} resultados`, 'success');
                        setTimeout(() => this.hideStatus(), 3000);
                    } else {
                        throw new Error(data.error || 'Error desconocido');
                    }
                    
                } catch (error) {
                    console.error('Error en búsqueda:', error);
                    this.showStatus(`❌ Error: ${error.message}`, 'error');
                }

                searchBtn.disabled = false;
                searchBtn.innerHTML = '🔍 Buscar';
            }

            displayResults(results) {
                this.results = results;
                const resultsGrid = document.getElementById('resultsGrid');
                const resultsSection = document.getElementById('resultsSection');
                
                resultsGrid.innerHTML = '';
                
                results.forEach((result, index) => {
                    const card = this.createResultCard(result, index);
                    resultsGrid.appendChild(card);
                });
                
                resultsSection.style.display = 'block';
            }

            createResultCard(result, index) {
                const card = document.createElement('div');
                card.className = 'result-card';
                card.dataset.videoId = result.id;
                
                const duration = this.formatDuration(result.duration);
                
                card.innerHTML = `
                    <div class="result-title">${this.escapeHtml(result.title)}</div>
                    <div class="result-info">
                        <span class="result-uploader">👤 ${this.escapeHtml(result.uploader)}</span>
                        <span class="result-duration">⏱️ ${duration}</span>
                    </div>
                    <div class="play-controls">
                        <button class="stream-btn" onclick="app.streamAudio('${result.id}', '${this.escapeHtml(result.title)}')">
                            🎧 Stream
                        </button>
                        <button class="play-btn" onclick="app.playDirect('${result.id}')">
                            ▶️ Play
                        </button>
                    </div>
                `;
                
                return card;
            }

            async streamAudio(videoId, title) {
                this.showStatus('🎵 Preparando stream...', 'loading');
                
                try {
                    // Mostrar el reproductor
                    this.showPlayer(title);
                    
                    // Configurar el audio player
                    const audioPlayer = document.getElementById('audioPlayer');
                    audioPlayer.src = `${this.baseURL}/stream/${videoId}`;
                    audioPlayer.style.display = 'block';
                    
                    // Marcar como reproduciendo
                    this.markAsPlaying(videoId);
                    
                    this.showStatus('✅ Stream iniciado', 'success');
                    setTimeout(() => this.hideStatus(), 2000);
                    
                } catch (error) {
                    console.error('Error en stream:', error);
                    this.showStatus(`❌ Error en stream: ${error.message}`, 'error');
                }
            }

            playDirect(videoId) {
                const url = `${this.baseURL}/stream/${videoId}`;
                window.open(url, '_blank');
                this.showStatus('▶️ Abriendo en nueva pestaña', 'success');
                setTimeout(() => this.hideStatus(), 2000);
            }

            showPlayer(title) {
                const playerSection = document.getElementById('playerSection');
                const currentTitle = document.getElementById('currentTitle');
                
                currentTitle.textContent = title;
                playerSection.style.display = 'block';
            }

            markAsPlaying(videoId) {
                // Remover marca anterior
                document.querySelectorAll('.result-card').forEach(card => {
                    card.classList.remove('playing');
                });
                
                // Marcar el actual
                const currentCard = document.querySelector(`[data-video-id="${videoId}"]`);
                if (currentCard) {
                    currentCard.classList.add('playing');
                }
            }

            formatDuration(seconds) {
                if (!seconds || seconds === 0) return 'N/A';
                
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Inicializar la aplicación
        const app = new AllMusicApp();

        // Debug info
        console.log('🎵 AllMusic App initialized');
        console.log('📡 Base URL:', app.baseURL);
    </script>
</body>
</html>
