<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AllMusic PRO</title>
    <style>
    /* ── Safari 9-13 / iOS 9-13 compatible ── */
    /* No: gap, inset, optional chaining, async/await, ReadableStream */
    * {
        -webkit-box-sizing: border-box;
        box-sizing: border-box;
        margin: 0; padding: 0;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
        background: #0a0a1a;
        color: #e0e0e0;
        min-height: 100vh;
        min-height: -webkit-fill-available;
        overflow-x: hidden;
    }

    .app {
        max-width: 500px;
        margin: 0 auto;
        padding: 12px 14px 30px;
    }

    /* ── Header ── */
    .header {
        text-align: center;
        padding-bottom: 14px;
        border-bottom: 1px solid rgba(102,126,234,0.2);
        margin-bottom: 14px;
    }
    .header h1 { font-size: 20px; color: #a0b4ff; font-weight: 700; }
    .header p  { font-size: 11px; color: #445; margin-top: 3px; }

    /* ── Tabs ── */
    .tabs {
        display: -webkit-flex;
        display: flex;
        margin-bottom: 14px;
        border-bottom: 1px solid rgba(102,126,234,0.15);
    }
    .tab {
        -webkit-flex: 1; flex: 1;
        background: transparent; border: none;
        color: #556; font-size: 12px; font-weight: 700;
        padding: 8px 4px; cursor: pointer;
        border-bottom: 2px solid transparent;
        -webkit-transition: color 0.15s; transition: color 0.15s;
    }
    .tab.active { color: #a0b4ff; border-bottom-color: #667eea; }
    .pane { display: none; }
    .pane.active { display: block; }

    /* ── Player ── */
    .player {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(102,126,234,0.2);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
        text-align: center;
    }

    .art-wrap {
        width: 120px; height: 120px;
        border-radius: 50%;
        margin: 0 auto 12px;
        position: relative;
        overflow: hidden;
        border: 2px solid rgba(102,126,234,0.3);
        background: -webkit-radial-gradient(circle, rgba(102,126,234,0.2), rgba(15,15,35,0.8));
        background: radial-gradient(circle, rgba(102,126,234,0.2), rgba(15,15,35,0.8));
        display: -webkit-flex; display: flex;
        -webkit-align-items: center; align-items: center;
        -webkit-justify-content: center; justify-content: center;
        font-size: 42px;
    }
    .art-wrap img {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        width: 100%; height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }
    .art-wrap.spinning {
        -webkit-animation: spin 12s linear infinite;
        animation: spin 12s linear infinite;
    }
    @-webkit-keyframes spin {
        to { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }
    @keyframes spin {
        to { -webkit-transform: rotate(360deg); transform: rotate(360deg); }
    }

    .track-title  { font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 4px; line-height: 1.3; }
    .track-artist { font-size: 12px; color: #7a8aaa; margin-bottom: 14px; }

    /* ── Controls ── */
    .controls {
        display: -webkit-flex; display: flex;
        -webkit-justify-content: center; justify-content: center;
        -webkit-align-items: center; align-items: center;
        margin-bottom: 14px;
    }
    .ctrl-btn {
        width: 44px; height: 44px;
        border-radius: 50%; border: none;
        background: rgba(255,255,255,0.08);
        color: #bbb; font-size: 16px; cursor: pointer;
        display: -webkit-flex; display: flex;
        -webkit-align-items: center; align-items: center;
        -webkit-justify-content: center; justify-content: center;
        margin: 0 4px;
        -webkit-transition: background 0.15s; transition: background 0.15s;
    }
    .ctrl-btn:active { background: rgba(255,255,255,0.18); }
    .ctrl-btn.play {
        width: 58px; height: 58px; font-size: 22px;
        background: -webkit-linear-gradient(135deg, #667eea, #764ba2);
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        -webkit-box-shadow: 0 4px 18px rgba(102,126,234,0.45);
        box-shadow: 0 4px 18px rgba(102,126,234,0.45);
    }

    /* ── Progress ── */
    .prog-bar {
        width: 100%; height: 4px;
        background: rgba(255,255,255,0.08);
        border-radius: 2px; overflow: hidden;
        margin-bottom: 4px;
    }
    .prog-fill {
        height: 100%; width: 0%;
        background: -webkit-linear-gradient(left, #667eea, #a78bfa);
        background: linear-gradient(90deg, #667eea, #a78bfa);
        border-radius: 2px;
    }
    .time-row {
        display: -webkit-flex; display: flex;
        -webkit-justify-content: space-between; justify-content: space-between;
        font-size: 11px; color: #445;
    }

    /* ── Volume ── */
    .vol-row {
        display: -webkit-flex; display: flex;
        -webkit-align-items: center; align-items: center;
        margin-top: 10px;
    }
    .vol-label { font-size: 12px; color: #556; margin-right: 8px; white-space: nowrap; }
    input[type="range"].vol-slider {
        -webkit-flex: 1; flex: 1;
        height: 4px;
        -webkit-appearance: none; appearance: none;
        background: -webkit-linear-gradient(left, #764ba2, #f093fb);
        background: linear-gradient(90deg, #764ba2, #f093fb);
        border-radius: 2px; outline: none; cursor: pointer;
    }
    input[type="range"].vol-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 18px; height: 18px;
        border-radius: 50%;
        background: #f093fb; border: 2px solid #fff; cursor: pointer;
    }

    /* ── Search ── */
    .search-row {
        display: -webkit-flex; display: flex;
        margin-bottom: 12px;
    }
    .search-row input {
        -webkit-flex: 1; flex: 1;
        padding: 11px 12px;
        background: rgba(255,255,255,0.06);
        border: 1px solid rgba(102,126,234,0.3);
        border-radius: 8px 0 0 8px;
        color: #e0e0e0; font-size: 15px;
        outline: none; -webkit-appearance: none;
    }
    .search-row input:focus { border-color: #667eea; }
    .search-row button {
        padding: 11px 18px;
        background: #667eea; border: none;
        border-radius: 0 8px 8px 0;
        color: #fff; font-size: 16px; cursor: pointer;
    }

    /* ── Result / History cards ── */
    .card {
        display: -webkit-flex; display: flex;
        -webkit-align-items: center; align-items: center;
        padding: 10px 8px;
        border-radius: 8px; cursor: pointer;
        border-bottom: 1px solid rgba(102,126,234,0.08);
        -webkit-transition: background 0.12s; transition: background 0.12s;
    }
    .card:active, .card.active { background: rgba(102,126,234,0.15); }
    .card-thumb {
        width: 42px; height: 42px;
        border-radius: 6px; -webkit-flex-shrink: 0; flex-shrink: 0;
        background: rgba(102,126,234,0.18);
        display: -webkit-flex; display: flex;
        -webkit-align-items: center; align-items: center;
        -webkit-justify-content: center; justify-content: center;
        font-size: 18px; overflow: hidden;
        margin-right: 10px;
    }
    .card-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .card-info { -webkit-flex: 1; flex: 1; min-width: 0; }
    .card-title  { font-size: 13px; font-weight: 600; color: #e0e0e0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .card-sub    { font-size: 11px; color: #7a8aaa; margin-top: 2px; }
    .card-dl {
        -webkit-flex-shrink: 0; flex-shrink: 0;
        padding: 6px 10px; margin-left: 4px;
        background: transparent; border: none;
        color: #667eea; font-size: 20px; cursor: pointer;
        text-decoration: none; display: inline-block;
    }

    /* ── Misc ── */
    .section-title {
        font-size: 11px; font-weight: 700;
        text-transform: uppercase; color: #667eea;
        letter-spacing: 0.6px; margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid rgba(102,126,234,0.15);
    }
    .empty { color: #445; font-size: 12px; text-align: center; padding: 20px; }
    .spinner { text-align: center; color: #667eea; padding: 18px; font-size: 13px; }

    /* clear history button */
    .clear-btn {
        float: right; background: transparent; border: none;
        color: #445; font-size: 11px; cursor: pointer; padding: 0;
    }
    .clear-btn:active { color: #f093fb; }
    </style>
</head>
<body>
<div class="app">

    <div class="header">
        <h1>🎵 AllMusic PRO</h1>
        <p>Música ecuatoriana y latina · Modo compatible</p>
    </div>

    <!-- ── Player ── -->
    <div class="player">
        <div class="art-wrap" id="artWrap">
            <img id="artImg" src="" alt="" style="display:none"
                 onerror="this.style.display='none'">
            <span id="artPh">🎵</span>
        </div>
        <div class="track-title"  id="trackTitle">AllMusic PRO</div>
        <div class="track-artist" id="trackArtist">Busca o selecciona una canción</div>

        <div class="controls">
            <button class="ctrl-btn" onclick="playPrev()">⏮</button>
            <button class="ctrl-btn" onclick="skipBack()" style="font-size:13px;">⏪</button>
            <button class="ctrl-btn play" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="ctrl-btn" onclick="skipFwd()" style="font-size:13px;">⏩</button>
            <button class="ctrl-btn" onclick="playNext()">⏭</button>
        </div>

        <div class="prog-bar">
            <div class="prog-fill" id="progFill"></div>
        </div>
        <div class="time-row">
            <span id="timeCur">00:00</span>
            <span id="timeTot">00:00</span>
        </div>

        <div class="vol-row">
            <span class="vol-label">🔊</span>
            <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="80"
                   oninput="setVol(this.value)">
        </div>
    </div>

    <!-- ── Tabs ── -->
    <div class="tabs">
        <button class="tab active" id="tab-search"  onclick="showTab('search')">🔍 Buscar</button>
        <button class="tab"        id="tab-history" onclick="showTab('history')">🕒 Historial</button>
    </div>

    <!-- ── Search pane ── -->
    <div class="pane active" id="pane-search">
        <div class="search-row">
            <input type="text" id="searchInput" placeholder="Buscar música…"
                   onkeypress="if(event.keyCode===13||event.which===13)doSearch()">
            <button onclick="doSearch()">🔍</button>
        </div>
        <div id="spinner" class="spinner" style="display:none">Buscando…</div>
        <div id="resultsList"></div>
    </div>

    <!-- ── History pane ── -->
    <div class="pane" id="pane-history">
        <div class="section-title">
            📻 Escuchadas recientemente
            <button class="clear-btn" onclick="clearHistory()">✕ Borrar</button>
        </div>
        <div id="histList"></div>
    </div>

</div>

<audio id="audio" preload="none" playsinline webkit-playsinline></audio>

<script>
/* ── AllMusic PRO Legacy Player ──
   Compatible: Safari 9-13, iOS 9-13, iPad Air/mini antiguos
   Sin: async/await, optional chaining (?.), ReadableStream, gap CSS
   Con: var, XHR, -webkit- prefixes, ES5
*/

var audio   = document.getElementById('audio');
var results = [];
var curIdx  = -1;
var activeId = '';
var recoveryAttempted = false;

/* ── LocalStorage historial ── */
var LS_PLAYED = 'am_played';
var histPlayed = [];
try {
    var _stored = localStorage.getItem(LS_PLAYED);
    if (_stored) histPlayed = JSON.parse(_stored) || [];
} catch(e) { histPlayed = []; }

function savePlayed() {
    try { localStorage.setItem(LS_PLAYED, JSON.stringify(histPlayed.slice(0, 50))); } catch(e) {}
}
function addToPlayed(title, artist, thumb, src, id) {
    if (histPlayed.length && histPlayed[0].title === title) {
        histPlayed[0].src = src;
        histPlayed[0].id = id || histPlayed[0].id || '';
        histPlayed[0].ts = Date.now();
        savePlayed();
        renderHistory();
        return;
    }
    histPlayed.unshift({ title: title, artist: artist, thumb: thumb, src: src, id: id || '', ts: Date.now() });
    if (histPlayed.length > 50) histPlayed.pop();
    savePlayed();
    renderHistory();
}
function clearHistory() {
    histPlayed = []; savePlayed(); renderHistory();
}

/* ── Utils ── */
function esc(s) {
    return s ? String(s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;') : '';
}
function fmtTime(s) {
    var m = Math.floor(s / 60), sc = Math.floor(s % 60);
    return (m < 10 ? '0' : '') + m + ':' + (sc < 10 ? '0' : '') + sc;
}
function setVol(v) { audio.volume = v / 100; }

/* ── Tabs ── */
function showTab(t) {
    var all = ['search', 'history'];
    for (var i = 0; i < all.length; i++) {
        var btn  = document.getElementById('tab-' + all[i]);
        var pane = document.getElementById('pane-' + all[i]);
        if (btn)  btn.className  = btn.className.replace(' active','')  + (all[i] === t ? ' active' : '');
        if (pane) pane.className = pane.className.replace(' active','') + (all[i] === t ? ' active' : '');
    }
    if (t === 'history') renderHistory();
}

/* ── Search via XHR ── */
function doSearch() {
    var q = document.getElementById('searchInput').value;
    if (!q || !q.trim()) return;
    document.getElementById('spinner').style.display = 'block';
    document.getElementById('resultsList').innerHTML = '';

    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'search?q=' + encodeURIComponent(q.trim()) + '&limit=30', true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        document.getElementById('spinner').style.display = 'none';
        if (xhr.status === 200) {
            try {
                var d = JSON.parse(xhr.responseText);
                results = d.results || [];
                renderResults(results);
            } catch(e) {
                document.getElementById('resultsList').innerHTML =
                    '<div class="empty">Error al procesar resultados</div>';
            }
        } else {
            document.getElementById('resultsList').innerHTML =
                '<div class="empty">Error de conexión (' + xhr.status + ')</div>';
        }
    };
    xhr.onerror = function() {
        document.getElementById('spinner').style.display = 'none';
        document.getElementById('resultsList').innerHTML =
            '<div class="empty">Sin conexión</div>';
    };
    xhr.send();
}

function renderResults(list) {
    var el = document.getElementById('resultsList');
    if (!list.length) { el.innerHTML = '<div class="empty">Sin resultados</div>'; return; }
    var html = '';
    for (var i = 0; i < list.length; i++) {
        var r = list[i];
        var thumbHtml = r.thumbnail
            ? '<img src="' + esc(r.thumbnail) + '" alt="" onerror="this.style.display=\'none\'">'
            : '🎵';
        var dur = r.duration ? fmtTime(r.duration) : '';
        html += '<div class="card" id="ri-' + i + '" onclick="selResult(' + i + ')">'
            + '<div class="card-thumb">' + thumbHtml + '</div>'
            + '<div class="card-info">'
            +   '<div class="card-title">' + esc(r.title) + '</div>'
            +   '<div class="card-sub">' + esc(r.uploader || 'YouTube') + (dur ? ' · ' + dur : '') + '</div>'
            + '</div>'
            + '<a class="card-dl" href="download/' + esc(r.id) + '.mp3"'
            +    ' download="' + esc(r.title) + '.mp3"'
            +    ' onclick="event.stopPropagation()"'
            +    ' title="Descargar">⬇</a>'
            + '</div>';
    }
    el.innerHTML = html;
}

function resolveDirectSrc(id, cb) {
    if (_dcache && _dcache[id]) { cb(_dcache[id]); return; }
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'convert/' + encodeURIComponent(id), true);
    xhr.onreadystatechange = function() {
        if (xhr.readyState !== 4) return;
        var src = 'stream/' + id;
        if (xhr.status === 200) {
            try {
                var d = JSON.parse(xhr.responseText);
                if (d && d.success && d.link) src = d.link;
            } catch(e) {}
        }
        _dcache[id] = src;
        cb(src);
    };
    xhr.onerror = function() { cb('stream/' + id); };
    xhr.send();
}
var _dcache = {};

function startPlaybackFromGesture(src) {
    audio.pause();
    audio.src = src;
    audio.load();
    var playRequest;
    try { playRequest = audio.play(); } catch(e) { playRequest = null; }
    if (playRequest && typeof playRequest.catch === 'function') {
        playRequest.catch(function() {
            /* Safari antiguo puede no devolver Promise; el evento error maneja el fallback. */
        });
    }
}

function selResult(i) {
    var prev = document.getElementById('ri-' + curIdx);
    if (prev) prev.className = prev.className.replace(' active', '');
    curIdx = i;
    var el = document.getElementById('ri-' + i);
    if (el) el.className += ' active';
    var r = results[i]; if (!r) return;

    activeId = r.id;
    recoveryAttempted = false;

    /*
     * iOS/Safari legacy exige que play() ocurra dentro del mismo gesto físico.
     * No se espera a /convert: arrancamos el endpoint de audio inmediatamente.
     */
    var streamSrc = 'stream/' + encodeURIComponent(r.id) + '?fast=1';
    startPlaybackFromGesture(streamSrc);
    addToPlayed(r.title, r.uploader || 'YouTube', r.thumbnail || '', streamSrc, r.id);

    /* Calienta el enlace alternativo sin romper el gesto de reproducción. */
    resolveDirectSrc(r.id, function(src) {
        if (src) _dcache[r.id] = src;
    });
    setInfo(r.title, r.uploader || 'YouTube', r.thumbnail || '');
}

/* ── Historial ── */
function renderHistory() {
    var el = document.getElementById('histList');
    if (!el) return;
    if (!histPlayed.length) {
        el.innerHTML = '<div class="empty">Aún no has escuchado canciones</div>';
        return;
    }
    var html = '';
    var max = Math.min(histPlayed.length, 30);
    for (var i = 0; i < max; i++) {
        var it = histPlayed[i];
        var thumbHtml = it.thumb
            ? '<img src="' + esc(it.thumb) + '" alt="" onerror="this.style.display=\'none\'">'
            : '🎵';
        var timeStr = it.ts ? new Date(it.ts).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        html += '<div class="card" onclick="playFromHistory(' + i + ')">'
            + '<div class="card-thumb">' + thumbHtml + '</div>'
            + '<div class="card-info">'
            +   '<div class="card-title">' + esc(it.title) + '</div>'
            +   '<div class="card-sub">' + esc(it.artist || '') + (timeStr ? ' · ' + timeStr : '') + '</div>'
            + '</div>'
            + '</div>';
    }
    el.innerHTML = html;
}

function playFromHistory(i) {
    var it = histPlayed[i]; if (!it) return;
    var id = it.id || '';
    if (!id && it.src && it.src.indexOf('stream/') === 0) {
        id = decodeURIComponent(it.src.slice('stream/'.length));
    }
    activeId = id;
    recoveryAttempted = false;

    if (id) {
        startPlaybackFromGesture('stream/' + encodeURIComponent(id) + '?fast=1');
        resolveDirectSrc(id, function(src) {
            if (src) _dcache[id] = src;
        });
    } else if (it.src) {
        startPlaybackFromGesture(it.src);
    }
    setInfo(it.title, it.artist || '', it.thumb || '');
}

/* ── Player UI ── */
function setInfo(title, artist, thumb) {
    document.getElementById('trackTitle').textContent  = title  || 'Sin título';
    document.getElementById('trackArtist').textContent = artist || '';
    var img = document.getElementById('artImg');
    var ph  = document.getElementById('artPh');
    if (thumb) {
        img.src = thumb; img.style.display = 'block'; ph.style.display = 'none';
    } else {
        img.style.display = 'none'; ph.style.display = '';
    }
}

/* ── Audio events ── */
audio.addEventListener('play', function() {
    document.getElementById('playBtn').textContent = '⏸';
    document.getElementById('artWrap').className = 'art-wrap spinning';
});
audio.addEventListener('pause', function() {
    document.getElementById('playBtn').textContent = '▶';
    document.getElementById('artWrap').className = 'art-wrap';
});
audio.addEventListener('ended', function() {
    document.getElementById('artWrap').className = 'art-wrap';
    document.getElementById('playBtn').textContent = '▶';
    if (curIdx >= 0 && curIdx + 1 < results.length) {
        selResult(curIdx + 1);
    }
});
audio.addEventListener('timeupdate', function() {
    if (!audio.duration) return;
    var pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progFill').style.width = pct.toFixed(1) + '%';
    document.getElementById('timeCur').textContent = fmtTime(audio.currentTime);
    document.getElementById('timeTot').textContent = fmtTime(audio.duration);
});
audio.addEventListener('error', function() {
    if (activeId && !recoveryAttempted) {
        recoveryAttempted = true;
        document.getElementById('trackArtist').textContent = 'Reintentando reproducción…';
        resolveDirectSrc(activeId, function(src) {
            if (!src || src === 'stream/' + activeId) {
                document.getElementById('trackArtist').textContent = 'Error al cargar el audio';
                return;
            }
            audio.src = src;
            audio.load();
            var retry;
            try { retry = audio.play(); } catch(e) { retry = null; }
            if (retry && typeof retry.catch === 'function') {
                retry.catch(function() {
                    document.getElementById('trackArtist').textContent = 'Toca ▶ para reproducir';
                });
            }
        });
        return;
    }
    document.getElementById('trackArtist').textContent = 'Error al cargar el audio';
    document.getElementById('artWrap').className = 'art-wrap';
    document.getElementById('playBtn').textContent = '▶';
});

/* ── Controls ── */
function togglePlay() {
    if (audio.paused) {
        var request;
        try { request = audio.play(); } catch(e) { request = null; }
        if (request && typeof request.catch === 'function') {
            request.catch(function() {
                document.getElementById('trackArtist').textContent = 'No se pudo iniciar. Selecciona la canción otra vez.';
            });
        }
    } else {
        audio.pause();
    }
}
function skipBack()   { audio.currentTime = Math.max(0, audio.currentTime - 10); }
function skipFwd()    { if (audio.duration) audio.currentTime = Math.min(audio.duration, audio.currentTime + 10); }
function playNext() {
    if (curIdx >= 0 && curIdx + 1 < results.length) selResult(curIdx + 1);
    else if (histPlayed.length > 1) playFromHistory(1);
}
function playPrev() {
    if (curIdx > 0) selResult(curIdx - 1);
