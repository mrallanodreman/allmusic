<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllMusic - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .status {
            background: rgba(0,255,0,0.2);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #00ff00;
            margin: 20px 0;
        }
        .test-btn {
            background: #ff6b6b;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
        }
        .test-btn:hover {
            background: #ff5252;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 AllMusic - Servidor Funcionando</h1>
        <div class="status">
            ✅ Frontend cargado correctamente<br>
            ✅ Servidor híbrido activo<br>
            ✅ yt-dlp + YouTube MP3 API listos
        </div>
        
        <div>
            <button class="test-btn" onclick="testSearch()">🔍 Test Búsqueda</button>
            <button class="test-btn" onclick="testStatus()">📊 Test Status</button>
        </div>
        
        <div id="results" style="margin-top: 20px;"></div>
    </div>

    <script>
        async function testSearch() {
            const results = document.getElementById('results');
            results.innerHTML = '⏳ Probando búsqueda...';
            
            try {
                const response = await fetch('/search?q=test');
                const data = await response.json();
                results.innerHTML = `✅ Búsqueda OK: ${data.results?.length || 0} resultados`;
            } catch (error) {
                results.innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        async function testStatus() {
            const results = document.getElementById('results');
            results.innerHTML = '⏳ Probando status...';
            
            try {
                const response = await fetch('/status');
                const data = await response.json();
                results.innerHTML = `✅ Status OK: ${data.status}, Cache: ${data.cache_size}`;
            } catch (error) {
                results.innerHTML = `❌ Error: ${error.message}`;
            }
        }
        
        // Auto-test al cargar
        window.onload = function() {
            console.log('🎵 AllMusic Test Page loaded');
            testStatus();
        };
    </script>
</body>
</html>
